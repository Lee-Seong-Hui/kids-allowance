<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<meta name="description" content="초3·초6 아이 용돈 관리 앱">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>우리 아이 용돈관리</title>
<style>
:root{--primary:#6d5dfc;--bg:#f5f6fb;--card:#fff;--text:#20232d;--muted:#7c8190;--line:#e8e9ef;--red:#e85b67;--green:#24a36a;--orange:#f29b38}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}
header{padding:22px 18px 12px;background:linear-gradient(135deg,#7566ff,#5b8def);color:#fff}
header h1{margin:0;font-size:23px}header p{margin:7px 0 0;font-size:13px;opacity:.9}
.tabs{display:flex;gap:8px;padding:12px 14px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:11px;border-radius:12px;background:#f1f2f7;color:#666;font-weight:700}.tab.active{background:var(--primary);color:#fff}
main{padding:14px}.child-card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #24245a0b}
.child-top{display:flex;justify-content:space-between;align-items:center}.child-name{font-size:19px;font-weight:800}.badge{font-size:12px;background:#eeeafd;color:var(--primary);padding:5px 9px;border-radius:20px}
.balance{font-size:31px;font-weight:900;margin:12px 0 16px}.balance small{font-size:13px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f7fa;border-radius:13px;padding:10px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:4px;font-size:14px}
.section-title{font-size:17px;font-weight:800;margin:20px 3px 10px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 3px;border-bottom:1px solid var(--line)}
.amount.plus{color:var(--green)}.amount.minus{color:var(--red)}.desc{font-size:14px}.date{font-size:11px;color:var(--muted);margin-top:3px}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;font-size:29px;box-shadow:0 8px 22px #4c3ee455}
.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end}.overlay.show{display:flex}
.modal{background:#fff;width:100%;max-width:760px;margin:auto 0 0;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 16px;font-size:20px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 6px}.input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.type-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.type-btn{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.type-btn.selected{border-color:var(--primary);background:#f0eeff;color:var(--primary);font-weight:800}
.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;padding:13px;border-radius:12px;font-weight:800}.save{background:var(--primary);color:#fff}.cancel{background:#f0f1f5}
.empty{text-align:center;color:var(--muted);padding:28px 5px;font-size:13px}
.settings{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}
.danger{color:var(--red)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
@media(min-width:700px){.modal{margin:auto;border-radius:24px;max-width:520px}}
</style>
</head>
<body>
<div class="app">
<header><h1>우리 아이 용돈관리</h1><p>월용돈과 친인척 용돈을 구분해서 관리해요</p></header>
<div class="tabs">
<button class="tab active" data-tab="home">전체</button>
<button class="tab" data-tab="child1" id="tabC1">초3</button>
<button class="tab" data-tab="child2" id="tabC2">초6</button>
<button class="tab" data-tab="settings">설정</button>
</div>
<main id="content"></main>
</div>
<button class="fab" id="addBtn">＋</button>

<div class="overlay" id="modal">
<div class="modal">
<h2>용돈 기록 추가</h2>
<label>아이</label><select id="mChild"></select>
<label>종류</label>
<div class="type-buttons">
<button class="type-btn selected" data-type="family">친인척에게 받은 용돈</button>
<button class="type-btn" data-type="spend">사용</button>
</div>
<div id="familyFields">
<label>받은 날짜</label><input class="input" id="mDate" type="date">
<label>받은 사람 / 내용</label><input class="input" id="mDesc" placeholder="예: 할머니, 추석 용돈">
<label>금액</label><input class="input" id="mAmount" type="number" min="0" step="1000" placeholder="100000">
</div>
<div id="spendFields" style="display:none">
<label>사용 날짜</label><input class="input" id="sDate" type="date">
<label>사용 내용</label><input class="input" id="sDesc" placeholder="예: 문구점">
<label>금액</label><input class="input" id="sAmount" type="number" min="0" step="1000" placeholder="5000">
</div>
<div class="actions"><button class="cancel" id="cancelBtn">취소</button><button class="save" id="saveBtn">저장</button></div>
<p class="note">월 정기용돈은 매월 자동으로 계산됩니다. 월용돈을 초과한 사용액은 친인척 용돈 잔액에서 자동으로 차감됩니다.</p>
</div>
</div>

<script>
const DEFAULT={
 children:{
  c1:{name:"초3",monthly:20000},
  c2:{name:"초6",monthly:50000}
 },
 transactions:[],
 carryOver:false
};
let state=JSON.parse(localStorage.getItem("kidsAllowance")||"null")||DEFAULT;
let currentTab="home", type="family";
const won=n=>new Intl.NumberFormat("ko-KR").format(Math.round(n||0))+"원";
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem("kidsAllowance",JSON.stringify(state));}
function monthKey(d){return (d||today()).slice(0,7)}
function monthSpent(id,month=monthKey()){return state.transactions.filter(t=>t.child===id&&t.type==="spend"&&t.date.startsWith(month)).reduce((s,t)=>s+t.amount,0)}
function familyBalance(id){return state.transactions.filter(t=>t.child===id&&t.type==="family").reduce((s,t)=>s+t.amount,0)}
function totals(id){
 const m=monthSpent(id), allowance=state.children[id].monthly;
 const over=Math.max(0,m-allowance);
 return {allowance,m,usedFromMonthly:Math.min(m,allowance),over,family:Math.max(0,familyBalance(id)-over),total:Math.max(0,allowance-m)+Math.max(0,familyBalance(id)-over)}
}
function money(n){return won(n)}
function card(id){
 const c=state.children[id], t=totals(id);
 return `<div class="child-card">
  <div class="child-top"><span class="child-name">👧 ${c.name}</span><span class="badge">월 ${money(c.monthly)}</span></div>
  <div class="balance">${money(t.total)} <small>사용 가능</small></div>
  <div class="grid">
   <div class="stat"><small>이번 달 사용</small><b>${money(t.m)}</b></div>
   <div class="stat"><small>월용돈 잔액</small><b>${money(Math.max(0,c.monthly-t.m))}</b></div>
   <div class="stat"><small>친인척 용돈</small><b>${money(t.family)}</b></div>
  </div>
  ${t.over?`<p class="note">이번 달 월용돈을 ${money(t.over)} 초과하여 친인척 용돈에서 자동 차감되었습니다.</p>`:""}
 </div>`
}
function recent(id){
 const arr=state.transactions.filter(t=>!id||t.child===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);
 if(!arr.length)return `<div class="empty">아직 기록이 없습니다.<br>오른쪽 아래 ＋ 버튼으로 추가해보세요.</div>`;
 return arr.map(t=>`<div class="row">
  <div><div class="desc">${t.type==="family"?"🎁 ":"🛍️ "}${escapeHtml(t.desc)}</div><div class="date">${t.date} · ${state.children[t.child].name}</div></div>
  <div class="amount ${t.type==="family"?"plus":"minus"}">${t.type==="family"?"+":"-"}${money(t.amount)}</div>
 </div>`).join("");
}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function updateTabs(){
 const t1=document.getElementById("tabC1"), t2=document.getElementById("tabC2");
 if(t1) t1.textContent=state.children.c1.name;
 if(t2) t2.textContent=state.children.c2.name;
}
function render(){
 updateTabs();
 const el=document.getElementById("content");
 if(currentTab==="settings"){
  el.innerHTML=`<div class="settings">
   <div class="section-title">아이 이름 설정</div>
   <label>첫째 아이 이름</label>
   <input class="input" id="nameC1" value="${escapeHtml(state.children.c1.name)}" placeholder="예: 민서">
   <label>둘째 아이 이름</label>
   <input class="input" id="nameC2" value="${escapeHtml(state.children.c2.name)}" placeholder="예: 지우">
   <div class="actions"><button class="save" id="saveNames">이름 저장</button></div>
   <p class="note">현재 이름은 초3 / 초6으로 되어 있습니다. 원하는 이름으로 변경하면 앱 전체에 적용됩니다.</p>
  </div>
  <div class="settings">
   <div class="section-title">월 정기용돈 설정</div>
   <label>${escapeHtml(state.children.c1.name)} 월용돈</label>
   <input class="input" id="monthlyC1" type="number" min="0" step="1000" value="${state.children.c1.monthly}">
   <label>${escapeHtml(state.children.c2.name)} 월용돈</label>
   <input class="input" id="monthlyC2" type="number" min="0" step="1000" value="${state.children.c2.monthly}">
   <div class="actions"><button class="save" id="saveMonthly">용돈 금액 저장</button></div>
   <p class="note">예: 20,000원을 30,000원으로 바꾸면 앞으로 월용돈 계산에 새 금액이 적용됩니다.</p>
  </div>
  <div class="settings">
   <div class="section-title">데이터 관리</div>
   <div class="setting-row"><button id="exportBtn">📥 기록 백업하기</button></div>
   <div style="background:#f5f6fb;border-radius:12px;padding:11px 12px;margin:0 0 8px;font-size:12px;line-height:1.6;color:#666;">
    📁 <strong style="color:#333;">백업 파일 저장 위치</strong><br>
    삼성 갤럭시: <b>내 파일 → 내장 저장공간 → Download(다운로드)</b><br>
    <span style="font-size:11px;">※ 브라우저의 다운로드 설정에 따라 저장 위치가 달라질 수 있습니다.</span>
   </div>
   <div class="setting-row"><button id="importBtn">📤 백업 불러오기</button></div>
   <div class="setting-row"><button class="danger" id="resetBtn">⚠️ 전체 기록 초기화</button></div>
   <input id="fileInput" type="file" accept=".json" style="display:none">
  </div>`;
  document.getElementById("saveNames").onclick=()=>{
   const n1=document.getElementById("nameC1").value.trim();
   const n2=document.getElementById("nameC2").value.trim();
   if(!n1||!n2){alert("두 아이의 이름을 모두 입력해주세요.");return;}
   state.children.c1.name=n1; state.children.c2.name=n2; save(); render(); alert("아이 이름이 저장되었습니다.");
  };
  document.getElementById("saveMonthly").onclick=()=>{
   const a=Number(document.getElementById("monthlyC1").value);
   const b=Number(document.getElementById("monthlyC2").value);
   if(a<0||b<0||!Number.isFinite(a)||!Number.isFinite(b)){alert("올바른 금액을 입력해주세요.");return;}
   state.children.c1.monthly=a; state.children.c2.monthly=b; save(); render(); updateTabs(); alert("월용돈 금액이 저장되었습니다.");
  };
  document.getElementById("exportBtn").onclick=exportData;
  document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange=importData;
  document.getElementById("resetBtn").onclick=()=>{if(confirm("모든 기록을 삭제할까요?")){state=DEFAULT;save();render()}};
  return;
 }
 const ids=currentTab==="home"?["c1","c2"]:[currentTab==="child1"?"c1":"c2"];
 el.innerHTML=ids.map(card).join("")+
  `<div class="section-title">최근 기록</div><div class="child-card">${recent(currentTab==="home"?null:ids[0])}</div>`;
}
function openModal(){
 document.getElementById("modal").classList.add("show");
 document.getElementById("mChild").innerHTML=Object.entries(state.children).map(([id,c])=>`<option value="${id}">${c.name}</option>`).join("");
 document.getElementById("mDate").value=today();document.getElementById("sDate").value=today();
 setType("family");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function setType(x){
 type=x;document.querySelectorAll(".type-btn").forEach(b=>b.classList.toggle("selected",b.dataset.type===x));
 document.getElementById("familyFields").style.display=x==="family"?"block":"none";
 document.getElementById("spendFields").style.display=x==="spend"?"block":"none";
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentTab=b.dataset.tab;render()});
document.querySelectorAll(".type-btn").forEach(b=>b.onclick=()=>setType(b.dataset.type));
document.getElementById("addBtn").onclick=openModal;
document.getElementById("cancelBtn").onclick=closeModal;
document.getElementById("saveBtn").onclick=()=>{
 const child=document.getElementById("mChild").value;
 if(type==="family"){
  const amount=Number(document.getElementById("mAmount").value),desc=document.getElementById("mDesc").value.trim(),date=document.getElementById("mDate").value;
  if(!amount||!desc||!date)return alert("날짜, 내용, 금액을 입력해주세요.");
  state.transactions.push({id:Date.now(),child,type,date,desc,amount});
 }else{
  const amount=Number(document.getElementById("sAmount").value),desc=document.getElementById("sDesc").value.trim(),date=document.getElementById("sDate").value;
  if(!amount||!desc||!date)return alert("날짜, 내용, 금액을 입력해주세요.");
  const t=totals(child);
  if(amount>t.total)return alert(`사용 가능 금액이 ${money(t.total)}입니다.`);
  state.transactions.push({id:Date.now(),child,type,date,desc,amount});
 }
 save();closeModal();render();
};
function exportData(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=`아이용돈백업_${today()}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.children||!x.transactions)throw 0;state=x;save();render();alert("백업을 불러왔습니다.")}catch{alert("올바른 백업 파일이 아닙니다.")}};
 r.readAsText(f);
}
render();
</script>
</body>
</html>
