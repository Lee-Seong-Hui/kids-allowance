<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="용돈관리">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>우리 아이 용돈관리</title>
<style>
:root{--primary:#6d5dfc;--bg:#f5f6fb;--card:#fff;--text:#20232d;--muted:#7c8190;--line:#e8e9ef;--red:#e85b67;--green:#24a36a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}
header{padding:22px 18px 12px;background:linear-gradient(135deg,#7566ff,#5b8def);color:#fff}header h1{margin:0;font-size:23px}header p{margin:7px 0 0;font-size:13px;opacity:.9}
.tabs{display:flex;gap:7px;padding:12px 10px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);overflow-x:auto}.tab{flex:1;min-width:62px;padding:10px 7px;border-radius:12px;background:#f1f2f7;color:#666;font-weight:700;white-space:nowrap}.tab.active{background:var(--primary);color:#fff}
main{padding:14px}.child-card,.settings{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #24245a0b}.child-top{display:flex;justify-content:space-between;align-items:center}.child-name{font-size:19px;font-weight:800}.badge{font-size:12px;background:#eeeafd;color:var(--primary);padding:5px 9px;border-radius:20px}
.balance{font-size:31px;font-weight:900;margin:12px 0 16px}.balance small{font-size:13px;color:var(--muted);font-weight:600}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f7fa;border-radius:13px;padding:10px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:4px;font-size:14px}
.section-title{font-size:17px;font-weight:800;margin:20px 3px 10px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 3px;border-bottom:1px solid var(--line);gap:10px}.row:last-child{border-bottom:0}.row-main{min-width:0;flex:1}.desc{font-size:14px;word-break:break-all}.date{font-size:11px;color:var(--muted);margin-top:3px}.amount.plus{color:var(--green)}.amount.minus{color:var(--red)}.row-actions{display:flex;gap:5px;margin-top:6px;justify-content:flex-end}.small-btn{padding:6px 9px;border-radius:8px;background:#f0f1f5;color:#555;font-size:11px;font-weight:700}.small-btn.delete{background:#fff0f1;color:var(--red)}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;font-size:29px;box-shadow:0 8px 22px #4c3ee455}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end}.overlay.show{display:flex}.modal{background:#fff;width:100%;max-width:760px;margin:auto 0 0;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 16px;font-size:20px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 6px}.input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;padding:13px;border-radius:12px;font-weight:800}.save{background:var(--primary);color:#fff}.cancel{background:#f0f1f5}.empty{text-align:center;color:var(--muted);padding:28px 5px;font-size:13px}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.danger{color:var(--red)}.note{font-size:12px;color:var(--muted);line-height:1.6}.month-nav{display:flex;align-items:center;gap:8px;background:#fff;padding:10px;border-radius:14px;margin-bottom:12px}.month-nav button{width:38px;height:38px;border-radius:10px;background:#f0f1f5}.month-nav input{flex:1;text-align:center}.kind-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}.kind-info{flex:1}.kind-name{font-weight:700}.kind-type{font-size:11px;margin-top:3px}.income{color:var(--green)}.expense{color:var(--red)}
@media(min-width:700px){.modal{margin:auto;border-radius:24px;max-width:520px}}
</style></head>
<body>
<div class="app"><header><h1>우리 아이 용돈관리</h1><p>월용돈과 받은 용돈을 아이별·월별로 관리해요</p></header>
<div class="tabs"><button class="tab active" data-tab="home">전체</button><button class="tab" data-tab="child1" id="tabC1">초3</button><button class="tab" data-tab="child2" id="tabC2">초6</button><button class="tab" data-tab="monthly">월별</button><button class="tab" data-tab="settings">설정</button></div>
<main id="content"></main></div><button class="fab" id="addBtn">＋</button>

<div class="overlay" id="recordModal"><div class="modal"><h2 id="recordTitle">용돈 기록 추가</h2>
<label>아이</label><select id="rChild"></select><label>용돈 종류</label><select id="rKind"></select>
<label>날짜</label><input class="input" id="rDate" type="date"><label>내용</label><input class="input" id="rDesc" placeholder="예: 할머니, 문구점">
<label>금액</label><input class="input" id="rAmount" inputmode="numeric" placeholder="100,000">
<div class="actions"><button class="cancel" onclick="closeRecord()">취소</button><button class="save" id="recordSave">저장</button></div></div></div>

<div class="overlay" id="kindModal"><div class="modal"><h2 id="kindTitle">용돈 종류 추가</h2>
<label>종류 이름</label><input class="input" id="kName" placeholder="예: 생일 용돈">
<label>구분</label><select id="kDirection"><option value="income">받은 돈 (+)</option><option value="expense">사용 (-)</option></select>
<div class="actions"><button class="cancel" onclick="closeKind()">취소</button><button class="save" id="kindSave">저장</button></div></div></div>

<script>
const DEFAULT={children:{c1:{name:"초3",monthly:20000},c2:{name:"초6",monthly:50000}},transactions:[],kinds:[{id:"family",name:"친인척에게 받은 용돈",direction:"income"},{id:"spend",name:"사용",direction:"expense"}]};
let state=JSON.parse(localStorage.getItem("kidsAllowance")||"null")||structuredClone(DEFAULT);
let tab="home",editId=null,editKindId=null,viewMonth=new Date().toISOString().slice(0,7);
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10), won=n=>(Number(n)||0).toLocaleString("ko-KR")+"원", fmt=n=>(Number(n)||0).toLocaleString("ko-KR");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const num=s=>Number(String(s||"").replace(/[^\d]/g,""))||0;
function save(){localStorage.setItem("kidsAllowance",JSON.stringify(state))}
function normalize(){state.children??=structuredClone(DEFAULT.children);state.transactions??=[];state.kinds??=structuredClone(DEFAULT.kinds);if(!state.kinds.find(k=>k.id==="family"))state.kinds.unshift(structuredClone(DEFAULT.kinds[0]));if(!state.kinds.find(k=>k.id==="spend"))state.kinds.push(structuredClone(DEFAULT.kinds[1]));state.transactions.forEach(t=>{t.kindId??=(t.type==="spend"?"spend":"family");t.amount=Number(t.amount)||0});save()}normalize();
function kind(id){return state.kinds.find(k=>k.id===id)}
function isExpense(t){return (kind(t.kindId)?.direction|| (t.type==="spend"?"expense":"income"))==="expense"}
function monthSpent(id,m=today().slice(0,7)){return state.transactions.filter(t=>t.child===id&&isExpense(t)&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0)}
function received(id){return state.transactions.filter(t=>t.child===id&&!isExpense(t)).reduce((s,t)=>s+t.amount,0)}
function totals(id){const used=monthSpent(id),monthly=state.children[id].monthly,over=Math.max(0,used-monthly),gift=Math.max(0,received(id)-over);return{used,monthly,gift,total:Math.max(0,monthly-used)+gift,over}}
function card(id){const c=state.children[id],t=totals(id);return `<div class="child-card"><div class="child-top"><span class="child-name">👧 ${esc(c.name)}</span><span class="badge">월 ${won(c.monthly)}</span></div><div class="balance">${won(t.total)} <small>사용 가능</small></div><div class="grid"><div class="stat"><small>이번 달 사용</small><b>${won(t.used)}</b></div><div class="stat"><small>월용돈 잔액</small><b>${won(Math.max(0,t.monthly-t.used))}</b></div><div class="stat"><small>받은 용돈</small><b>${won(t.gift)}</b></div></div>${t.over?`<p class="note">월용돈 초과액 ${won(t.over)}은 받은 용돈에서 차감됩니다.</p>`:""}</div>`}
function sortTx(a){return [...a].sort((x,y)=>y.date.localeCompare(x.date)||Number(y.id)-Number(x.id))}
function txRow(t){const ex=isExpense(t),k=kind(t.kindId),c=state.children[t.child];return `<div class="row"><div class="row-main"><div class="desc">${ex?"🛍️":"🎁"} ${esc(t.desc)}</div><div class="date">${t.date} · ${esc(c?.name)} · ${esc(k?.name||"기타")}</div></div><div style="text-align:right"><div class="amount ${ex?"minus":"plus"}">${ex?"-":"+"}${won(t.amount)}</div><div class="row-actions"><button class="small-btn" onclick="openRecord(${t.id})">수정</button><button class="small-btn delete" onclick="deleteTx(${t.id})">삭제</button></div></div></div>`}
function list(id,limit=20){const a=sortTx(state.transactions.filter(t=>!id||t.child===id)).slice(0,limit);return a.length?a.map(txRow).join(""):`<div class="empty">기록이 없습니다.</div>`}
function render(){ $("tabC1").textContent=state.children.c1.name;$("tabC2").textContent=state.children.c2.name;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));const e=$("content");if(tab==="settings")return renderSettings(e);if(tab==="monthly")return renderMonthly(e);const ids=tab==="home"?["c1","c2"]:[tab==="child1"?"c1":"c2"];let h=ids.map(card).join("");if(tab==="home")h+=Object.entries(state.children).map(([id,c])=>`<div class="section-title">최근 기록 · ${esc(c.name)}</div><div class="child-card">${list(id,10)}</div>`).join("");else h+=`<div class="section-title">최근 기록</div><div class="child-card">${list(ids[0])}</div>`;e.innerHTML=h}
function renderMonthly(e){const a=sortTx(state.transactions.filter(t=>t.date.startsWith(viewMonth))),inc=a.filter(t=>!isExpense(t)).reduce((s,t)=>s+t.amount,0),out=a.filter(isExpense).reduce((s,t)=>s+t.amount,0);e.innerHTML=`<div class="month-nav"><button onclick="moveMonth(-1)">‹</button><input class="input" id="monthPick" type="month" value="${viewMonth}"><button onclick="moveMonth(1)">›</button></div><div class="child-card"><div class="grid"><div class="stat"><small>받은 돈</small><b class="income">${won(inc)}</b></div><div class="stat"><small>사용</small><b class="expense">${won(out)}</b></div><div class="stat"><small>기록</small><b>${a.length}건</b></div></div></div>${Object.entries(state.children).map(([id,c])=>{const x=a.filter(t=>t.child===id);return `<div class="section-title">👧 ${esc(c.name)}</div><div class="child-card">${x.length?x.map(txRow).join(""):`<div class="empty">이 달의 기록이 없습니다.</div>`}</div>`}).join("")}`;$("monthPick").onchange=x=>{viewMonth=x.target.value;render()}}
function moveMonth(n){const d=new Date(viewMonth+"-01T00:00:00");d.setMonth(d.getMonth()+n);viewMonth=d.toISOString().slice(0,7);render()}
function renderSettings(e){e.innerHTML=`<div class="settings"><div class="section-title">아이 이름</div><label>첫째</label><input class="input" id="n1" value="${esc(state.children.c1.name)}"><label>둘째</label><input class="input" id="n2" value="${esc(state.children.c2.name)}"><div class="actions"><button class="save" id="saveNames">이름 저장</button></div></div><div class="settings"><div class="section-title">월 정기용돈</div><label>${esc(state.children.c1.name)}</label><input class="input cash" id="m1" inputmode="numeric" value="${fmt(state.children.c1.monthly)}"><label>${esc(state.children.c2.name)}</label><input class="input cash" id="m2" inputmode="numeric" value="${fmt(state.children.c2.monthly)}"><div class="actions"><button class="save" id="saveMonthly">금액 저장</button></div></div><div class="settings"><div class="section-title">용돈 종류 관리</div>${state.kinds.map(k=>`<div class="kind-item"><div class="kind-info"><div class="kind-name">${esc(k.name)}</div><div class="kind-type ${k.direction}">${k.direction==="income"?"받은 돈 (+)":"사용 (-)"}</div></div><div><button class="small-btn" onclick="openKind('${k.id}')">수정</button> <button class="small-btn delete" onclick="deleteKind('${k.id}')">삭제</button></div></div>`).join("")}<div class="actions"><button class="save" onclick="openKind()">＋ 종류 추가</button></div></div><div class="settings"><div class="section-title">데이터 관리</div><div class="setting-row"><button onclick="exportData()">📥 기록 백업하기</button></div><div class="setting-row"><button onclick="$('fileInput').click()">📤 백업 불러오기</button></div><div class="setting-row"><button class="danger" onclick="resetAll()">⚠️ 전체 초기화</button></div><input id="fileInput" type="file" accept=".json" style="display:none"></div>`;
$("saveNames").onclick=()=>{if(!$("n1").value.trim()||!$("n2").value.trim())return alert("이름을 입력해주세요.");state.children.c1.name=$("n1").value.trim();state.children.c2.name=$("n2").value.trim();save();render()};
$("saveMonthly").onclick=()=>{state.children.c1.monthly=num($("m1").value);state.children.c2.monthly=num($("m2").value);save();render()};document.querySelectorAll(".cash").forEach(moneyField);$("fileInput").onchange=importData}
function moneyField(i){i.oninput=()=>{const n=num(i.value);i.value=n?fmt(n):""}}
function openRecord(id=null){editId=id;$("recordModal").classList.add("show");$("recordTitle").textContent=id?"용돈 기록 수정":"용돈 기록 추가";$("rChild").innerHTML=Object.entries(state.children).map(([x,c])=>`<option value="${x}">${esc(c.name)}</option>`).join("");$("rKind").innerHTML=state.kinds.map(k=>`<option value="${k.id}">${k.direction==="income"?"＋":"－"} ${esc(k.name)}</option>`).join("");const t=id?state.transactions.find(x=>Number(x.id)===Number(id)):null;$("rChild").value=t?t.child:(tab==="child1"?"c1":tab==="child2"?"c2":"c1");$("rKind").value=t?t.kindId:"family";$("rDate").value=t?t.date:today();$("rDesc").value=t?t.desc:"";$("rAmount").value=t?fmt(t.amount):"";moneyField($("rAmount"))}
function closeRecord(){$("recordModal").classList.remove("show");editId=null}
$("recordSave").onclick=()=>{const child=$("rChild").value,kindId=$("rKind").value,date=$("rDate").value,desc=$("rDesc").value.trim(),amount=num($("rAmount").value),k=kind(kindId);if(!date||!desc||!amount)return alert("날짜, 내용, 금액을 입력해주세요.");const t=editId?state.transactions.find(x=>Number(x.id)===Number(editId)):null;if(t)Object.assign(t,{child,kindId,type:k.direction==="expense"?"spend":"family",date,desc,amount});else state.transactions.push({id:Date.now(),child,kindId,type:k.direction==="expense"?"spend":"family",date,desc,amount});save();closeRecord();render()}
function deleteTx(id){const t=state.transactions.find(x=>Number(x.id)===Number(id));if(t&&confirm(`"${t.desc}" 기록을 삭제할까요?`)){state.transactions=state.transactions.filter(x=>Number(x.id)!==Number(id));save();render()}}
function openKind(id=null){editKindId=id;$("kindModal").classList.add("show");const k=id?kind(id):null;$("kindTitle").textContent=k?"용돈 종류 수정":"용돈 종류 추가";$("kName").value=k?k.name:"";$("kDirection").value=k?k.direction:"income"}
function closeKind(){$("kindModal").classList.remove("show");editKindId=null}
$("kindSave").onclick=()=>{const name=$("kName").value.trim(),direction=$("kDirection").value;if(!name)return alert("종류 이름을 입력해주세요.");if(editKindId){const k=kind(editKindId);k.name=name;k.direction=direction}else state.kinds.push({id:"k"+Date.now(),name,direction});save();closeKind();render()}
function deleteKind(id){const k=kind(id);if(!k)return;if(!confirm(`"${k.name}" 종류를 삭제할까요?`))return;const fallback=k.direction==="expense"?"spend":"family";state.transactions.forEach(t=>{if(t.kindId===id)t.kindId=fallback});state.kinds=state.kinds.filter(x=>x.id!==id);save();render()}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`아이용돈백업_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);normalize();render();alert("백업을 불러왔습니다.")}catch{alert("올바른 백업 파일이 아닙니다.")}};r.readAsText(f)}
function resetAll(){if(confirm("모든 기록과 설정을 초기화할까요?")){state=structuredClone(DEFAULT);save();render()}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$("addBtn").onclick=()=>openRecord();render();
</script>
<script>
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
