<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="용돈관리">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>용돈관리</title>
<meta name="app-version" content="2026-10-01-v11">
<style>
:root{--primary:#6d5dfc;--bg:#f5f6fb;--card:#fff;--text:#20232d;--muted:#7c8190;--line:#e8e9ef;--red:#e85b67;--green:#24a36a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}
header{padding:22px 18px 12px;background:linear-gradient(135deg,#7566ff,#5b8def);color:#fff}header h1{margin:0;font-size:23px}header p{margin:7px 0 0;font-size:13px;opacity:.9}
.tabs{display:flex;gap:7px;padding:12px 10px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);overflow-x:auto}.tab{flex:1;min-width:62px;padding:10px 7px;border-radius:12px;background:#f1f2f7;color:#666;font-weight:700;white-space:nowrap}.tab.active{background:var(--primary);color:#fff}
main{padding:14px}.child-card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #24245a0b}.child-top{display:flex;justify-content:space-between;align-items:center}.child-name{font-size:19px;font-weight:800}.badge{font-size:16px;font-weight:800;background:#eeeafd;color:var(--primary);padding:7px 12px;border-radius:20px}.over-note{font-size:14px;color:var(--muted);line-height:1.6;margin-top:10px}.over-amount{font-size:20px;font-weight:900;color:#3978e8;white-space:nowrap}
.balance{font-size:31px;font-weight:900;margin:12px 0 16px}.balance.negative{color:var(--red)}.balance small{font-size:13px;color:var(--muted);font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f7f7fa;border-radius:13px;padding:10px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:4px;font-size:14px}
.section-title{font-size:17px;font-weight:800;margin:20px 3px 10px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 3px;border-bottom:1px solid var(--line);gap:10px}.row:last-child{border-bottom:0}.row-main{min-width:0;flex:1}.desc{font-size:14px;word-break:break-all}.date{font-size:11px;color:var(--muted);margin-top:3px}.amount.plus{color:var(--green)}.amount.minus{color:var(--red)}.row-actions{display:flex;gap:5px;margin-top:5px;justify-content:flex-end}.small-btn{padding:6px 8px;border-radius:8px;background:#f0f1f5;color:#555;font-size:11px;font-weight:700}.small-btn.delete{background:#fff0f1;color:var(--red)}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;font-size:29px;box-shadow:0 8px 22px #4c3ee455}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end}.overlay.show{display:flex}.modal{background:#fff;width:100%;max-width:760px;margin:auto 0 0;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 16px;font-size:20px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 6px}.input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;padding:13px;border-radius:12px;font-weight:800}.save{background:var(--primary);color:#fff}.cancel{background:#f0f1f5}.empty{text-align:center;color:var(--muted);padding:28px 5px;font-size:13px}
.settings{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.danger{color:var(--red)}.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}.month-nav{display:flex;align-items:center;gap:8px;background:#fff;padding:10px;border-radius:14px;margin-bottom:12px}.month-nav button{width:38px;height:38px;border-radius:10px;background:#f0f1f5}.month-nav input{flex:1;text-align:center}.kind-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}.kind-info{flex:1}.kind-name{font-weight:700}.kind-type{font-size:11px;color:var(--muted);margin-top:3px}.income-label{color:var(--green);font-weight:700}.expense-label{color:var(--red);font-weight:700}
#mChild{font-size:26px;font-weight:900;height:68px;padding:0 18px}#modal label:first-of-type{font-size:16px;font-weight:800;color:var(--text)}
@media(min-width:700px){.modal{margin:auto;border-radius:24px;max-width:520px}}
</style>
</head>
<body>
<div class="app">
<header><h1>용돈관리</h1><p>월용돈과 받은 용돈을 구분해서 관리해요</p><button id="installPwaBtn" onclick="installPwa()" style="display:none;margin:10px 18px 0 auto;padding:9px 13px;border-radius:12px;background:#fff;color:#5f51e8;font-weight:800">📱 홈 화면에 설치</button></header>
<div class="tabs"><button class="tab active" data-tab="home">전체</button><button class="tab" data-tab="child1" id="tabC1">초3</button><button class="tab" data-tab="child2" id="tabC2">초6</button><button class="tab" data-tab="monthly">월별</button><button class="tab" data-tab="settings">설정</button></div>
<main id="content"></main></div><button class="fab" id="addBtn">＋</button>

<div class="overlay" id="modal"><div class="modal"><h2 id="modalTitle">용돈 기록 추가</h2><label>아이</label><select id="mChild"></select><label>종류</label><select id="mKind"></select><label>날짜</label><input class="input" id="mDate" type="date"><label>내용</label><input class="input" id="mDesc" placeholder="예: 할머니, 문구점"><label>금액</label><input class="input" id="mAmount" inputmode="numeric" placeholder="100,000"><div class="actions"><button class="cancel" id="cancelBtn">취소</button><button class="save" id="saveBtn">저장</button></div></div></div>
<div class="overlay" id="kindModal"><div class="modal"><h2 id="kindModalTitle">용돈 종류 추가</h2><label>종류 이름</label><input class="input" id="kindName" placeholder="예: 생일 용돈"><label>구분</label><select id="kindDirection"><option value="income">받은 돈 (+)</option><option value="expense">사용 (-)</option></select><div class="actions"><button class="cancel" id="kindCancelBtn">취소</button><button class="save" id="kindSaveBtn">저장</button></div></div></div>

<script>
const DEFAULT={children:{c1:{name:"초3",monthly:20000},c2:{name:"초6",monthly:50000}},transactions:[],kinds:[{id:"family",name:"친인척에게 받은 용돈",direction:"income"},{id:"spend",name:"사용",direction:"expense"}],carryOver:false};
let state=JSON.parse(localStorage.getItem("kidsAllowance")||"null")||JSON.parse(JSON.stringify(DEFAULT));
let currentTab="home",editingId=null,editingKindId=null,selectedMonth=new Date().toISOString().slice(0,7);
function save(){localStorage.setItem("kidsAllowance",JSON.stringify(state))}
function getKind(id){return state.kinds.find(k=>k.id===id)}
function normalize(){if(!state.children)state.children=JSON.parse(JSON.stringify(DEFAULT.children));if(!Array.isArray(state.transactions))state.transactions=[];if(!Array.isArray(state.kinds))state.kinds=JSON.parse(JSON.stringify(DEFAULT.kinds));if(!state.kinds.some(k=>k.id==="family"))state.kinds.unshift({id:"family",name:"친인척에게 받은 용돈",direction:"income"});if(!state.kinds.some(k=>k.id==="spend"))state.kinds.push({id:"spend",name:"사용",direction:"expense"});state.transactions.forEach(t=>{if(!t.kindId)t.kindId=t.type==="spend"?"spend":"family";if(!t.type)t.type=(getKind(t.kindId)?.direction==="expense")?"spend":"family";t.amount=Number(t.amount)||0});save()}
const won=n=>new Intl.NumberFormat("ko-KR").format(Math.round(Number(n)||0))+"원",fmt=n=>new Intl.NumberFormat("ko-KR").format(Math.round(Number(n)||0)),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),parseMoney=v=>Number(String(v||"").replace(/,/g,"").replace(/[^\d]/g,""))||0;
normalize();ensureMonthlyAllowance();
function expense(t){const k=getKind(t.kindId);return k?k.direction==="expense":t.type==="spend"}
function isMonthlyAllowance(t){return t.kindId==="monthly_allowance"||t.type==="monthly_allowance"}
function ensureMonthlyAllowance(){
  if(!state.kinds.some(k=>k.id==="monthly_allowance"))state.kinds.unshift({id:"monthly_allowance",name:"정기 월용돈",direction:"income",system:true});
  const now=today(),month=now.slice(0,7),date=month+"-01";
  Object.entries(state.children).forEach(([id,c])=>{
    const exists=state.transactions.some(t=>t.child===id&&isMonthlyAllowance(t)&&String(t.date||"").slice(0,7)===month);
    if(!exists){state.transactions.push({id:Date.now()+Math.floor(Math.random()*1000),child:id,kindId:"monthly_allowance",type:"monthly_allowance",date,desc:"정기 월용돈",amount:Number(c.monthly)||0,auto:true});}
  });
  save();
}
function monthSpent(id,month=today().slice(0,7)){return state.transactions.filter(t=>t.child===id&&expense(t)&&t.date.startsWith(month)).reduce((s,t)=>s+t.amount,0)}
function familyBalance(id){return state.transactions.filter(t=>t.child===id&&!expense(t)&&!isMonthlyAllowance(t)).reduce((s,t)=>s+t.amount,0)}
function totalOverSpent(id){const months={};state.transactions.filter(t=>t.child===id&&expense(t)).forEach(t=>{const m=(t.date||"").slice(0,7);if(m)months[m]=(months[m]||0)+t.amount});return Object.entries(months).reduce((s,[m,v])=>{const paid=monthlyAllowanceReceived(id,m)||Number(state.children[id].monthly)||0;return s+Math.max(0,v-paid)},0)}
function monthlyAllowanceReceived(id,month=today().slice(0,7)){return state.transactions.filter(t=>t.child===id&&isMonthlyAllowance(t)&&String(t.date||"").startsWith(month)).reduce((s,t)=>s+t.amount,0)}
function totals(id,month=today().slice(0,7)){const m=monthSpent(id,month),a=monthlyAllowanceReceived(id,month),o=Math.max(0,m-a),netFamily=familyBalance(id)-totalOverSpent(id);return{m,allowance:a,over:o,family:Math.max(0,netFamily),total:Math.max(0,a-m)+netFamily}}
function card(id){const c=state.children[id],t=totals(id);return `<div class="child-card"><div class="child-top"><span class="child-name">👧 ${esc(c.name)}</span><span class="badge">월 ${won(c.monthly)}</span></div><div class="balance ${t.total<0?"negative":""}">${won(t.total)} <small>사용 가능</small></div><div class="grid"><div class="stat"><small>이번 달 받은 월용돈</small><b class="income-label">${won(t.allowance)}</b></div><div class="stat"><small>이번 달 사용</small><b>${won(t.m)}</b></div><div class="stat"><small>월용돈 잔액</small><b>${won(Math.max(0,t.allowance-t.m))}</b></div><div class="stat"><small>받은 용돈</small><b>${won(t.family)}</b></div></div>${t.over?`<p class="over-note">월용돈을 <span class="over-amount">${won(t.over)}</span> 초과하여 받은 용돈에서 자동 차감됩니다.</p>`:""}</div>`}
function row(t){const ex=expense(t),k=getKind(t.kindId),c=state.children[t.child];return `<div class="row"><div class="row-main"><div class="desc">${ex?"🛍️":"🎁"} ${esc(t.desc)}</div><div class="date">${esc(t.date)} · ${esc(c?.name||"")} · ${esc(k?.name||"")}</div></div><div style="text-align:right"><div class="amount ${ex?"minus":"plus"}">${ex?"-":"+"}${won(t.amount)}</div><div class="row-actions"><button class="small-btn" onclick="editTransaction(${t.id})">수정</button><button class="small-btn delete" onclick="deleteTransaction(${t.id})">삭제</button></div></div></div>`}
function sorted(a){return [...a].sort((x,y)=>(y.date||"").localeCompare(x.date||"")||Number(y.id)-Number(x.id))}
function recent(id){
  const all=sorted(state.transactions.filter(t=>!id||t.child===id));
  if(!all.length)return `<div class="empty">아직 기록이 없습니다.<br>오른쪽 아래 ＋ 버튼으로 추가해보세요.</div>`;
  const groups={};
  all.forEach(t=>{const m=String(t.date||"").slice(0,7)||"날짜없음";(groups[m]||(groups[m]=[])).push(t)});
  return Object.keys(groups).sort().reverse().map(m=>{
    const items=groups[m],inc=items.filter(t=>!expense(t)).reduce((s,t)=>s+t.amount,0),out=items.filter(t=>expense(t)).reduce((s,t)=>s+t.amount,0),balance=inc-out;
    const title=m==="날짜없음"?m:`${m.slice(0,4)}년 ${Number(m.slice(5,7))}월`;
    return `<div style="margin:4px 0 14px;padding:14px 16px;background:#f7f7fb;border-radius:18px"><div style="font-size:19px;font-weight:900;margin-bottom:8px">📅 ${title}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px"><div>받은 돈<br><b style="color:#2ca56c;font-size:16px">${won(inc)}</b></div><div>사용<br><b style="color:#df5a67;font-size:16px">${won(out)}</b></div><div>월 합계<br><b style="font-size:16px">${balance>=0?"+":"-"}${won(Math.abs(balance))}</b></div></div></div>${items.map(row).join("")}`
  }).join("")
}
function grouped(){return Object.entries(state.children).map(([id,c])=>`<div class="section-title">👧 ${esc(c.name)} · 월별 최근 기록</div><div class="child-card">${recent(id)}</div>`).join("")}
function updateTabs(){document.getElementById("tabC1").textContent=state.children.c1.name;document.getElementById("tabC2").textContent=state.children.c2.name}
function render(){updateTabs();document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));const el=document.getElementById("content");if(currentTab==="settings")return settings(el);if(currentTab==="monthly")return monthly(el);const ids=currentTab==="home"?["c1","c2"]:[currentTab==="child1"?"c1":"c2"];el.innerHTML=ids.map(card).join("")+(currentTab==="home"?grouped():`<div class="section-title">최근 기록</div><div class="child-card">${recent(ids[0])}</div>`)}
function monthly(el){
  const a=sorted(state.transactions.filter(t=>t.date.startsWith(selectedMonth))),
        inc=a.filter(t=>!expense(t)).reduce((s,t)=>s+t.amount,0),
        out=a.filter(t=>expense(t)).reduce((s,t)=>s+t.amount,0);

  el.innerHTML=`<div class="month-nav"><button onclick="changeMonth(-1)">‹</button><input class="input" id="monthPicker" type="month" value="${selectedMonth}"><button onclick="changeMonth(1)">›</button></div>
  <div class="child-card"><div class="grid">
    <div class="stat"><small>전체 받은 돈</small><b class="income-label">${won(inc)}</b></div>
    <div class="stat"><small>전체 사용</small><b class="expense-label">${won(out)}</b></div>
    <div class="stat"><small>전체 기록 수</small><b>${a.length}건</b></div>
  </div></div>
  ${Object.entries(state.children).map(([id,c])=>{
    const x=a.filter(t=>t.child===id),
          childInc=x.filter(t=>!expense(t)).reduce((s,t)=>s+t.amount,0),
          childOut=x.filter(t=>expense(t)).reduce((s,t)=>s+t.amount,0);
    return `<div class="section-title">👧 ${esc(c.name)}</div>
      <div class="child-card">
        <div class="grid" style="margin-bottom:12px">
          <div class="stat"><small>받은 용돈 합계</small><b class="income-label">${won(childInc)}</b></div>
          <div class="stat"><small>사용금액 합계</small><b class="expense-label">${won(childOut)}</b></div>
          <div class="stat"><small>기록 수</small><b>${x.length}건</b></div>
        </div>
        ${x.length?x.map(row).join(""):`<div class="empty">이 달의 기록이 없습니다.</div>`}
      </div>`;
  }).join("")}`;
  document.getElementById("monthPicker").onchange=e=>{selectedMonth=e.target.value;render()}
}
function changeMonth(n){const [y,m]=selectedMonth.split("-").map(Number);const d=new Date(y,m-1+n,1);selectedMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
function formatMoney(i){const apply=()=>{const digits=String(i.value||"").replace(/[^0-9]/g,"");i.value=digits?Number(digits).toLocaleString("ko-KR"):""};i.addEventListener("input",apply);i.addEventListener("change",apply);apply()}
function settings(el){el.innerHTML=`<div class="settings"><div class="section-title">아이 이름 설정</div><label>첫째 아이 이름</label><input class="input" id="nameC1" value="${esc(state.children.c1.name)}"><label>둘째 아이 이름</label><input class="input" id="nameC2" value="${esc(state.children.c2.name)}"><div class="actions"><button class="save" id="saveNames">이름 저장</button></div></div><div class="settings"><div class="section-title">월 정기용돈 설정</div><label>${esc(state.children.c1.name)} 월용돈</label><input class="input money" id="monthlyC1" inputmode="numeric" value="${fmt(state.children.c1.monthly)}"><label>${esc(state.children.c2.name)} 월용돈</label><input class="input money" id="monthlyC2" inputmode="numeric" value="${fmt(state.children.c2.monthly)}"><div class="actions"><button class="save" id="saveMonthly">용돈 금액 저장</button></div></div><div class="settings"><div class="section-title">용돈 종류 관리</div>${state.kinds.map(k=>`<div class="kind-item"><div class="kind-info"><div class="kind-name">${esc(k.name)}</div><div class="kind-type ${k.direction==="income"?"income-label":"expense-label"}">${k.direction==="income"?"받은 돈 (+)":"사용 (-)"}</div></div><div>${k.system?'자동입금':`<button class="small-btn" onclick="editKind('${k.id}')">수정</button> <button class="small-btn delete" onclick="deleteKind('${k.id}')">삭제</button>`}</div></div>`).join("")}<div class="actions"><button class="save" id="addKindBtn">＋ 용돈 종류 추가</button></div></div><div class="settings"><div class="section-title">데이터 관리</div><div class="setting-row"><button id="exportBtn">📥 기록 백업하기</button></div><div class="setting-row"><button id="importBtn">📤 백업 불러오기</button></div><div class="setting-row"><button class="danger" id="resetBtn">⚠️ 전체 기록 초기화</button></div><input id="fileInput" type="file" accept=".json" style="display:none"></div>`;
document.getElementById("saveNames").onclick=()=>{const a=document.getElementById("nameC1").value.trim(),b=document.getElementById("nameC2").value.trim();if(!a||!b)return alert("두 이름을 모두 입력해주세요.");state.children.c1.name=a;state.children.c2.name=b;save();render()};
document.getElementById("saveMonthly").onclick=()=>{state.children.c1.monthly=parseMoney(document.getElementById("monthlyC1").value);state.children.c2.monthly=parseMoney(document.getElementById("monthlyC2").value);save();render()};
document.querySelectorAll(".money").forEach(formatMoney);document.getElementById("addKindBtn").onclick=()=>openKindModal();document.getElementById("exportBtn").onclick=exportData;document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();document.getElementById("fileInput").onchange=importData;document.getElementById("resetBtn").onclick=()=>{if(confirm("모든 기록과 설정을 삭제할까요?")){state=JSON.parse(JSON.stringify(DEFAULT));save();render()}}}
function openModal(id=null){editingId=id;document.getElementById("modal").classList.add("show");document.getElementById("modalTitle").textContent=id?"용돈 기록 수정":"용돈 기록 추가";document.getElementById("mChild").innerHTML=Object.entries(state.children).map(([i,c])=>`<option value="${i}">${esc(c.name)}</option>`).join("");document.getElementById("mKind").innerHTML=state.kinds.filter(k=>!k.system).map(k=>`<option value="${k.id}">${k.direction==="income"?"＋":"－"} ${esc(k.name)}</option>`).join("");const t=id?state.transactions.find(x=>Number(x.id)===Number(id)):null;document.getElementById("mChild").value=t?t.child:(currentTab==="child1"?"c1":currentTab==="child2"?"c2":"c1");document.getElementById("mKind").value=t?t.kindId:"family";document.getElementById("mDate").value=t?t.date:today();document.getElementById("mDesc").value=t?t.desc:"";document.getElementById("mAmount").value=t?fmt(t.amount):"";formatMoney(document.getElementById("mAmount"))}
function closeModal(){document.getElementById("modal").classList.remove("show");editingId=null}
function saveTransaction(){const child=document.getElementById("mChild").value,kindId=document.getElementById("mKind").value,date=document.getElementById("mDate").value,desc=document.getElementById("mDesc").value.trim(),amount=parseMoney(document.getElementById("mAmount").value),k=getKind(kindId);if(!child||!k||!date||!desc||!amount)return alert("모든 항목을 입력해주세요.");const t=editingId?state.transactions.find(x=>Number(x.id)===Number(editingId)):null;if(t)Object.assign(t,{child,kindId,type:k.direction==="expense"?"spend":"family",date,desc,amount});else state.transactions.push({id:Date.now(),child,kindId,type:k.direction==="expense"?"spend":"family",date,desc,amount});save();closeModal();render()}
function editTransaction(id){openModal(id)}function deleteTransaction(id){const t=state.transactions.find(x=>Number(x.id)===Number(id));if(t&&confirm(`"${t.desc}" 기록을 삭제할까요?`)){state.transactions=state.transactions.filter(x=>Number(x.id)!==Number(id));save();render()}}
function openKindModal(id=null){editingKindId=id;document.getElementById("kindModal").classList.add("show");const k=id?getKind(id):null;document.getElementById("kindModalTitle").textContent=k?"용돈 종류 수정":"용돈 종류 추가";document.getElementById("kindName").value=k?k.name:"";document.getElementById("kindDirection").value=k?k.direction:"income"}
function closeKindModal(){document.getElementById("kindModal").classList.remove("show");editingKindId=null}
function saveKind(){const name=document.getElementById("kindName").value.trim(),direction=document.getElementById("kindDirection").value;if(!name)return alert("종류 이름을 입력해주세요.");if(editingKindId){const k=getKind(editingKindId);k.name=name;k.direction=direction}else state.kinds.push({id:"kind_"+Date.now(),name,direction});save();closeKindModal();render()}
function editKind(id){openKindModal(id)}function deleteKind(id){const k=getKind(id);if(!k)return;if(state.transactions.some(t=>t.kindId===id)&&!confirm(`이 종류가 사용된 기록이 있습니다.\n종류를 삭제해도 기록 자체는 남습니다.\n"${k.name}" 종류를 삭제할까요?`))return;state.kinds=state.kinds.filter(x=>x.id!==id);state.transactions.forEach(t=>{if(t.kindId===id)t.kindId=t.type==="spend"?"spend":"family"});save();render()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`아이용돈백업_${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);normalize();render();alert("백업을 불러왔습니다.")}catch{alert("올바른 백업 파일이 아닙니다.")}e.target.value=""};r.readAsText(f)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()});document.getElementById("addBtn").onclick=()=>openModal();document.getElementById("cancelBtn").onclick=closeModal;document.getElementById("saveBtn").onclick=saveTransaction;document.getElementById("kindCancelBtn").onclick=closeKindModal;document.getElementById("kindSaveBtn").onclick=saveKind;render();
</script>
<script>
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));let deferredInstallPrompt=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;const b=document.getElementById("installPwaBtn");if(b)b.style.display="block"});async function installPwa(){if(!deferredInstallPrompt){alert("Chrome 또는 Samsung Internet 메뉴에서 '홈 화면에 추가' 또는 '앱 설치'를 확인해주세요.");return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null}
</script>
</body></html>
